version: '3.8'

services:
  # ============================================================
  # SARA3 - Batch Tests 8 Paralelo
  # ============================================================
  sara3-batch:
    build:
      context: .
      dockerfile: Dockerfile
    image: sara3:latest
    container_name: sara3-batch-tests

    # Memoria compartida amplia para Chrome (tmpfs en RAM). Imprescindible tras
    # quitar --disable-dev-shm-usage de serenity.properties: sin esto, /dev/shm
    # queda en 64 MB y los renderers de Chrome caen bajo carga concurrente.
    shm_size: "4gb"

    # Variables de entorno
    environment:
      DISPLAY: ""
      QT_QPA_PLATFORM: "offscreen"
      JAVA_OPTS: "-Xmx2048m -Xms512m"
      CHROME_BIN: "/usr/bin/google-chrome"
      RUNNERS: "8"
    
    # Volúmenes
    volumes:
      # Montar reporte generado en el host
      - ./target/reports:/app/target/reports
      - ./target/site:/app/target/site
      - ./logs:/app/logs
    
    # Recursos
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Comando: corre las 50 clases con N forks en paralelo (RUNNERS).
    # El entrypoint ya hace `bash -c "$@"`, por eso va como string único
    # (sin envolver en otro bash -c) para que ${RUNNERS} se expanda en el contenedor.
    command: ["./gradlew test --parallel --continue --max-workers=$${RUNNERS} -PmaxParallelForks=$${RUNNERS}"]

  # ============================================================
  # SARA3 - Menú Interactivo (para desarrollo)
  # ============================================================
  sara3-interactive:
    build:
      context: .
      dockerfile: Dockerfile
    image: sara3:latest
    container_name: sara3-interactive

    # /dev/shm amplio para Chrome (ver nota en sara3-batch)
    shm_size: "2gb"

    environment:
      DISPLAY: ""
      QT_QPA_PLATFORM: "offscreen"
      JAVA_OPTS: "-Xmx2048m -Xms512m"
      CHROME_BIN: "/usr/bin/chromium-browser"
    
    volumes:
      - ./target/reports:/app/target/reports
      - ./target/site:/app/target/site
      - ./logs:/app/logs
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Menú interactivo
    stdin_open: true
    tty: true
    command: ./run_tests.sh

  # ============================================================
  # SARA3 - Test Individual (para debugging)
  # ============================================================
  sara3-single:
    build:
      context: .
      dockerfile: Dockerfile
    image: sara3:latest
    container_name: sara3-single-test

    # /dev/shm amplio para Chrome (ver nota en sara3-batch)
    shm_size: "2gb"

    environment:
      DISPLAY: ""
      QT_QPA_PLATFORM: "offscreen"
      JAVA_OPTS: "-Xmx2048m -Xms512m"
      CHROME_BIN: "/usr/bin/google-chrome"
      TEST_NUM: "01"  # Cambiar número de test
    
    volumes:
      - ./target/reports:/app/target/reports
      - ./target/site:/app/target/site
      - ./logs:/app/logs
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Ejecutar test individual
    # NOTA: el entrypoint ya hace `bash -c "$@"`, por eso aquí va el comando como
    # string único (sin envolver en otro bash -c) y sin comillas simples, para
    # que ${TEST_NUM} se expanda en el contenedor.
    command: ["./gradlew test --tests com.sara.automation.runners.CasesRunner$${TEST_NUM}"]

networks:
  default:
    name: sara3-network
    driver: bridge

# Volúmenes nombrados para reportes
volumes:
  sara3-reports:
    driver: local
  sara3-logs:
    driver: local
