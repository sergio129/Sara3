# ============================================================
# SARA3 - Automatización de pruebas en Docker
# ------------------------------------------------------------
# Uso:
#   Interactivo (te pregunta cuántos runners, requiere terminal):
#     docker compose run --rm sara3
#
#   Desatendido / servidor (sin menú, eliges runners por variable):
#     RUNNERS=8  docker compose up sara3
#     RUNNERS=12 docker compose run --rm sara3
#
#   Si no defines RUNNERS y no hay terminal, usa 8 por defecto.
#
# Reportes generados (montados en ./target del host):
#   - target/site/serenity/index.html      (Serenity HTML)
#   - target/reports/step_details_*.csv     (CSV)
#   - target/reports/step_details_*.xlsx    (Excel)
#   - target/reports/step_details_*.html    (Dashboard HTML)
# ============================================================

services:
  sara3:
    build:
      context: .
      dockerfile: Dockerfile
    image: sara3:latest
    container_name: sara3-tests

    environment:
      # Número de runners en paralelo. Vacío = el contenedor decide
      # (menú si hay terminal, 8 por defecto si no la hay).
      RUNNERS: "${RUNNERS:-}"
      JAVA_OPTS: "-Xmx2048m -Xms512m"
      CHROME_BIN: "/usr/bin/google-chrome"
      QT_QPA_PLATFORM: "offscreen"

    # Reportes y logs persistidos en el host
    volumes:
      - ./target:/app/target
      - ./logs:/app/logs

    # Permite el menú interactivo con 'docker compose run'
    stdin_open: true
    tty: true

    # Límites de recursos: DESACTIVADOS por defecto para no depender del hardware
    # del servidor (este tiene 2 CPUs). Si quieres limitar, descomenta y ajusta
    # 'cpus'/'memory' a valores <= a los del servidor:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2"
    #       memory: 4G

    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: sara3-network
    driver: bridge
