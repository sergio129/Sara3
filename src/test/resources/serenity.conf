webdriver {
    driver = chrome
    autodownload = false
}

chrome.switches = "--remote-allow-origins=*;--start-maximized"

serenity {
    take.screenshots = FOR_EACH_ACTION
    # Mantener capturas en disco aunque el paso sea idéntico al anterior
    full.page.screenshot.enabled = true
}

chrome_preferences {
    download.prompt_for_download = false
    download.default_directory = target/downloads
}
