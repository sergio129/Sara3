# Paralelismo moderado
maxParallelForks=1

org.gradle.parallel=true
org.gradle.daemon=true

# Workers controlados
# workers.max es el tope GLOBAL de forks paralelos: el nº real de runners en
# paralelo = min(maxParallelForks, workers.max). Se sube a 16 (alineado con
# r5.4xlarge) para no topar artificialmente; las corridas orquestadas además
# pasan --max-workers=RUNNERS.
org.gradle.parallel.workers=2
org.gradle.workers.max=16

# Memoria JVM
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:+UseG1GC

# Logs
org.gradle.logging.level=info

# Timeout worker socket = 4 horas
org.gradle.internal.worker.socket.timeout=14400000
